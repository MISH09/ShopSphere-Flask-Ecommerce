{% extends "base.html" %}
{% block title %}Create an account | ShopSphere{% endblock %}
{% block content %}
<section class="auth-page section-shell"><div class="auth-art peach"><span>✳</span><p>A little more<br>you, every day.</p><small>MAKE ROOM FOR GOOD FINDS</small></div><div class="auth-panel"><p class="eyebrow">JOIN THE GOOD STUFF</p><h1>Come on <em>in.</em></h1><p class="auth-intro">Create an account to keep track of your orders.</p><form method="post" class="stacked-form"><label>Your name<input type="text" name="name" required autocomplete="name" placeholder="Your full name"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="button button-dark full-button" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>
{% endblock %}
